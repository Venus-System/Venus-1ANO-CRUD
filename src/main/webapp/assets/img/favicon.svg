<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- O logo.png é branco; este filtro pinta ele de roxo para aparecer em abas claras -->
    <filter id="pintar-roxo">
      <feFlood flood-color="#610b9d"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
  </defs>
  <image x="2" y="0" width="60" height="64" preserveAspectRatio="xMidYMid meet" filter="url(#pintar-roxo)" href="data:image/png;base64,"/>
</svg>
